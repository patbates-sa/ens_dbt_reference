version: 2

models:
  - name: dim_device
    description: >-
      Device dimension enriched with site attributes and interface counts. is_monitored_device explains why joins from inventory to telemetry legitimately lose rows.
       Device dimension. Joins to incidents and interface performance.
    columns:
      - name: device_id
        tests: [unique, not_null]
        entity:
          type: primary
          name: device
      - name: hostname
        tests: [unique, not_null]
      - name: site_region
        tests: [not_null]
        dimension:
          type: categorical
      - name: monitored_interface_count
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: device_class
        dimension:
          type: categorical
      - name: vendor
        dimension:
          type: categorical
      - name: owning_team
        dimension:
          type: categorical
      - name: environment
        dimension:
          type: categorical
      - name: site_code
        dimension:
          type: categorical
      - name: install_date
        granularity: day
        dimension:
          type: time
          name: installed_at
    semantic_model:
      enabled: true
      name: dim_device
    agg_time_dimension: installed_at
    metrics:

      - name: device_count
        agg: count_distinct
        expr: device_id

        type: simple
        hidden: true
  - name: fct_interface_performance_hourly
    description: >-
      Hourly interface performance with device and site context. Incremental, built on the hourly rollup rather than raw five-minute telemetry.
       Hourly interface performance.
    columns:
      - name: interface_id
        tests: [not_null]
        entity:
          type: primary
          name: interface
      - name: metric_hour
        tests: [not_null]
        dimension:
          type: time
          name: metric_hour_ts
        granularity: hour
      - name: peak_utilization_pct_out
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: device_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_device')
                field: device_id
        entity:
          type: foreign
          name: device
      - name: device_class
        dimension:
          type: categorical
      - name: owning_team
        dimension:
          type: categorical
      - name: site_region
        dimension:
          type: categorical
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [interface_id, metric_hour]

    semantic_model:
      enabled: true
      name: fct_interface_performance_hourly
    agg_time_dimension: metric_hour_ts
    metrics:
      - name: peak_utilization
        label: "Peak utilization %"
        description: "Maximum outbound interface utilization over the selected window."
        type: simple
        agg: max
        expr: peak_utilization_pct_out
      - name: total_errors
        agg: sum
        expr: total_errors
        type: simple
        hidden: true
  - name: fct_incident_telemetry_correlation
    description: >-
      One row per in-scope, CI-resolved incident, with telemetry, syslog and change-window context from the configured lookback window before it opened. This is the model that replaces the hand-built stitch.
       Incident grain with telemetry and change-window context.
    columns:
      - name: incident_number
        description: "Grain."
        tests: [unique, not_null]
        entity:
          type: primary
          name: incident
      - name: device_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_device')
                field: device_id
        entity:
          type: foreign
          name: device
      - name: opened_ts
        tests: [not_null]
        dimension:
          type: time
          name: opened_at
        granularity: day
      - name: peak_util_out_prior_window
        description: >
          Null is legitimate: the device may have no monitored interfaces.
          The notebook could not distinguish that from a broken join.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: worst_severity_prior_window
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 7
                inclusive: true
      - name: match_method
        tests:
          - accepted_values:
              arguments:
                values: ['exact', 'fqdn', 'asset_tag', 'embedded', 'description']
        dimension:
          type: categorical
      - name: opened_during_change_window
        tests: [not_null]
        dimension:
          type: categorical
      - name: incident_severity
        dimension:
          type: categorical
      - name: assignment_group
        dimension:
          type: categorical
      - name: had_elevated_utilization
        dimension:
          type: categorical
    semantic_model:
      enabled: true
      name: fct_incident_telemetry_correlation
    agg_time_dimension: opened_at
    metrics:
      - name: incident_count
        label: "Incidents"
        description: "Count of incidents, sliceable by severity, assignment group, site, region and device class."
        type: simple
        agg: count
        expr: incident_number
      - name: resolved_incident_count
        description: "Incidents with a resolved timestamp."
        agg: count
        expr: case when not is_open then incident_number end

        type: simple
        hidden: true
      - name: total_minutes_to_resolve
        description: "Sum of resolution time in minutes, resolved incidents only."
        agg: sum
        expr: coalesce(minutes_to_resolve, 0)

        type: simple
        hidden: true
      - name: incidents_during_change_window
        description: "Incidents that opened inside an active change window."
        agg: sum
        expr: case when opened_during_change_window then 1 else 0 end

        type: simple
        hidden: true
      - name: mean_time_to_resolve
        label: "Mean time to resolve (minutes)"
        description: "Average resolution time in minutes across resolved incidents."
        type: ratio
        numerator: total_minutes_to_resolve
        denominator: resolved_incident_count
      - name: pct_incidents_during_change_window
        label: "% incidents during a change window"
        description: >
          Share of incidents that opened inside an active change window. The
          one-line answer to a question the organisation asks constantly.
        type: ratio
        numerator: incidents_during_change_window
        denominator: incident_count


  # DBT-21: the Monday regional review slide, as a governed table.
  - name: fct_site_reliability_weekly
    description: >-
      One row per site per week, weeks starting Monday. Replaces the hand-built
      regional review slide: incident volume and its S1/S2 subset, change-window
      overlap, mean time to resolve, outbound utilization, and in-service device
      count for normalisation.


      Dense by construction. Every site appears in every week in the reporting
      range, so a quiet week reads as zero rather than as a missing row.


      Scope, and the two things worth reading before reconciling this table
      against anything else:


      1. Incidents that cannot be attributed to a device are out of scope. An
      incident with no device has no site, so it cannot be placed in a site-week.
      int_ens__ci_resolved attributes roughly 86% of incidents; the remainder is
      absent from this table by design. Totals here will not match the raw
      ServiceNow incident count, and that is not a bug.


      2. Telemetry retention is shorter than incident history. The utilization
      columns are null for weeks older than retention. has_telemetry states that
      as a column so "not measured" is distinguishable from "measured and low"
      without reading this description.


      Device counts are current inventory applied to every week, not as-of-week.
      ens_device_snapshot only began accumulating history at its first run, so an
      as-of-week count would report zero devices for every week already in this
      table.
    columns:
      - name: site_code
        description: "Grain, with week_start_date."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ens__site')
                field: site_code
        entity:
          type: foreign
          name: site
      - name: week_start_date
        description: "Monday of the reporting week. Grain, with site_code."
        tests: [not_null]
        dimension:
          type: time
          name: week_start
        granularity: week
      - name: week_end_date
        description: "Sunday of the reporting week. Inclusive."
        tests: [not_null]
      - name: is_partial_week
        description: >
          The first and last weeks of the range are clipped by data availability.
          Flagged so a short week is not read as a quiet one.
        tests: [not_null]
        dimension:
          type: categorical
      - name: site_region
        tests: [not_null]
        dimension:
          type: categorical
      - name: site_tier
        dimension:
          type: categorical
      - name: site_country
        dimension:
          type: categorical
      - name: in_service_device_count
        description: >
          Devices at the site with lifecycle_state = 'in_service'. The
          denominator that stops a 200-device site being compared to a
          six-device site on raw counts. Current inventory, not as-of-week.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: incidents_opened
        description: "Device-attributed incidents opened in the week, all severities. Zero, never null."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: high_severity_incidents_opened
        description: "The S1/S2 subset of incidents_opened, per var('incident_severities')."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: incidents_during_change_window
        description: "Incidents that opened inside an active change window on their device."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: pct_incidents_during_change_window
        description: >
          Change-window share of the week's incidents. Null, not zero, when the
          week had no incidents: there was nothing to measure, and 0% reads as a
          finding.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: avg_minutes_to_resolve
        description: >
          Mean resolution time across incidents opened in the week that have
          since resolved. Null when the week resolved nothing.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: peak_utilization_pct_out
        description: >
          Highest outbound utilization seen on any monitored interface at the
          site during the week. Null when has_telemetry is false.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: avg_utilization_pct_out
        description: >
          Mean outbound utilization across the site's monitored interface-hours
          in the week. Null when has_telemetry is false.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: has_telemetry
        description: >
          False means no interface telemetry exists for this site-week, which is
          expected outside the retention window. Distinguishes "no telemetry"
          from "low utilization".
        tests: [not_null]
        dimension:
          type: categorical
      - name: incidents_per_100_in_service_devices
        description: "incidents_opened normalised by site size. Null when the site has no in-service devices."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [site_code, week_start_date]

    semantic_model:
      enabled: true
      name: fct_site_reliability_weekly
    agg_time_dimension: week_start
    metrics:
      - name: site_week_incident_count
        label: "Site incidents"
        description: "Device-attributed incidents, sliceable by region, tier and site."
        type: simple
        agg: sum
        expr: incidents_opened
      - name: site_week_high_severity_incident_count
        label: "Site S1/S2 incidents"
        description: "The S1/S2 subset of site incidents."
        type: simple
        agg: sum
        expr: high_severity_incidents_opened
      - name: site_week_incidents_during_change_window
        description: "Incidents that opened inside an active change window."
        type: simple
        agg: sum
        expr: incidents_during_change_window
        hidden: true
      - name: site_week_resolved_incident_count
        description: "Incidents opened in the week that have since resolved."
        type: simple
        agg: sum
        expr: resolved_incidents
        hidden: true
      - name: site_week_total_minutes_to_resolve
        description: "Sum of resolution time in minutes, resolved incidents only."
        type: simple
        agg: sum
        expr: total_minutes_to_resolve
        hidden: true
      - name: site_week_mean_time_to_resolve
        label: "Site mean time to resolve (minutes)"
        description: >
          Average resolution time in minutes. Built from the summed numerator and
          denominator so it re-aggregates correctly above the week grain.
        type: ratio
        numerator: site_week_total_minutes_to_resolve
        denominator: site_week_resolved_incident_count
      - name: site_week_pct_incidents_during_change_window
        label: "% site incidents during a change window"
        description: >
          Change-window share of incidents. Re-aggregates from counts, so a
          region-level or quarter-level figure is a true share and not an average
          of percentages.
        type: ratio
        numerator: site_week_incidents_during_change_window
        denominator: site_week_incident_count
      - name: site_week_peak_utilization
        label: "Site peak utilization %"
        description: "Highest outbound utilization on any monitored interface at the site."
        type: simple
        agg: max
        expr: peak_utilization_pct_out

  - name: time_spine_hourly
    description: Hourly time spine covering five years back through 30 days ahead.
    time_spine:
      standard_granularity_column: date_hour
    columns:
      - name: date_hour
        description: Standard hourly join key for MetricFlow time-based queries.
        granularity: hour
        tests: [unique, not_null]
