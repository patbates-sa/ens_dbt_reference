version: 2

models:
  - name: stg_ens__site
    description: "One row per site. Rename and cast only."
    columns:
      - name: site_code
        tests: [unique, not_null]

  - name: stg_ens__device
    description: >
      One row per device. Hostname and FQDN are canonicalised to lowercase and
      trimmed here so that no downstream model re-implements that logic.
    columns:
      - name: device_id
        tests: [unique, not_null]
      - name: hostname
        description: "Canonical lowercase hostname. The CI resolution join target."
        tests: [not_null]
      - name: site_code
        tests:
          - relationships:
              arguments:
                to: ref('stg_ens__site')
                field: site_code
  - name: stg_ens__interface
    description: "One row per interface. interface_description nullified when blank."
    columns:
      - name: interface_id
        tests: [unique, not_null]
      - name: device_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ens__device')
                field: device_id
      - name: is_monitored
        description: "Only ~2,400 of ~13,800 interfaces are monitored, which is why telemetry is narrower than inventory."
        tests: [not_null]

  - name: stg_ens__interface_metric_5m
    description: "Five-minute interface telemetry. ~9.7M rows."
    columns:
      - name: interface_id
        tests: [not_null]
      - name: metric_ts
        tests: [not_null]
      - name: utilization_pct_out
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: poll_status
        tests:
          - accepted_values:
              arguments:
                values: ['ok', 'timeout', 'partial']

  - name: stg_ens__device_health_5m
    description: "Five-minute device health telemetry. ~4.8M rows."
    columns:
      - name: device_id
        tests: [not_null]

  - name: stg_ens__syslog_event
    description: "Syslog events with severity 0-7. is_critical_event flags severity <= 3."
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: syslog_severity
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 7
                inclusive: true
  - name: stg_ens__incident
    description: >
      ServiceNow-shaped incidents. cmdb_ci_raw is preserved and cmdb_ci_clean is
      the canonicalised form; resolution to a device happens in int_ens__ci_resolved.
    columns:
      - name: incident_number
        tests: [unique, not_null]
      - name: opened_ts
        tests: [not_null]
      - name: incident_severity
        tests:
          - accepted_values:
              arguments:
                values: ['S1', 'S2', 'S3', 'S4']

  - name: stg_ens__change_request
    description: >
      Change records. effective_start_ts and effective_end_ts coalesce actual over
      planned, so overrunning changes are handled once rather than per consumer.
    columns:
      - name: change_number
        tests: [unique, not_null]
      - name: change_outcome
        tests:
          - accepted_values:
              arguments:
                values: ['successful', 'backed_out', 'failed']

  - name: stg_ens__jira_issue
    description: "Jira issues. Links to incidents, not to devices."
    columns:
      - name: issue_key
        tests: [unique, not_null]