version: 2

models:
  - name: int_ens__ci_resolved
    description: >
      Resolves the deliberately inconsistent cmdb_ci field on incidents to a
      device_id across five precedence tiers: exact, fqdn, asset_tag, embedded,
      description. Every model that combines a ticket with telemetry passes
      through here, which is why one test protects the whole downstream graph.
      Lands at 86.00% resolved against generated data.
    columns:
      - name: incident_number
        description: "Grain. One row per incident, resolved or not."
        tests: [unique, not_null]
      - name: device_id
        description: "Null when no tier matched. ~14% of rows by design."
        tests:
          - relationships:
              arguments:
                to: ref('stg_ens__device')
                field: device_id
      - name: match_method
        description: "Which tier resolved this row. 'unresolved' when none did."
        tests:
          - accepted_values:
              arguments:
                values: ['exact', 'fqdn', 'asset_tag', 'embedded', 'description', 'unresolved']

  - name: int_ens__interface_metric_hourly
    description: >
      Hourly rollup of five-minute interface telemetry, incremental with a
      three-hour reprocessing window. The cost argument.
    columns:
      - name: interface_id
        tests: [not_null]
      - name: metric_hour
        tests: [not_null]
      - name: peak_utilization_pct_out
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [interface_id, metric_hour]